[package]
name = "hostswitch"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "macOS / Windows hosts 文件管理与切换工具"
license = "MIT"

[dependencies]
# glow（OpenGL）后端比默认 wgpu 内存占用小很多
# 临时切 wgpu：目标机是 QEMU Windows 无 GPU 驱动（OpenGL 仅 1.1），glow 起不来；wgpu 走 D3D12 WARP 软件渲染
eframe = { version = "0.35", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "x11",
    "wgpu",
] }
egui = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework-sys = "2.17.0"
core-foundation-sys = "0.8.7"

[target.'cfg(target_os = "windows")'.dependencies]
runas = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
