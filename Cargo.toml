[package]
name = "hostswitch"
version = "0.1.0"
edition = "2024"
description = "跨平台 hosts 文件管理与切换工具"
license = "MIT"

[dependencies]
# glow（OpenGL）后端比默认 wgpu 内存占用小很多
eframe = { version = "0.35", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "x11",
    "glow",
] }
egui = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
security-framework-sys = "2.17.0"
core-foundation-sys = "0.8.7"

[dev-dependencies]
tempfile = "3"
