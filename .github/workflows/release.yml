# 推送 v* tag（或手动指定 tag）时构建 macOS/Windows 产物并挂到 GitHub Release
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要挂产物的已有 tag（如 v0.1.0）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # tag 推送用 github.ref_name；手动跑用输入的 tag
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 产物只按 OS 命名；arch 由 runner 本机原生构建决定，脚本不绑死 arch
          - name: macos
            os: macos-latest
            artifact_key: macos
          - name: windows
            os: windows-latest
            artifact_key: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手动跑时也按指定 tag 检出，保证版本与产物一致
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *) VERSION="$TAG" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.artifact_key }}

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: ./build_macos.sh dmg

      - name: Stage macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          KEY="${{ matrix.artifact_key }}"
          mkdir -p staged
          src="dist/hostswitch.dmg"
          test -f "$src"
          cp "$src" "staged/hostswitch-${VERSION}-${KEY}.dmg"
          ls -lh staged/

      - name: Install rcedit (Windows icon)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # bat 只认 tools/rcedit.exe；这里按 runner 选上游包，对构建脚本仍透明
          mkdir -p tools
          case "$(uname -m)" in
            x86_64|amd64) RC_ASSET=rcedit-x64.exe ;;
            i686|i386)    RC_ASSET=rcedit-x86.exe ;;
            *)
              echo "unsupported Windows runner arch: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL -o tools/rcedit.exe \
            "https://github.com/electron/rcedit/releases/download/v2.0.0/${RC_ASSET}"
          test -s tools/rcedit.exe

      - name: Build Windows EXE
        if: runner.os == 'Windows'
        shell: cmd
        run: build_windows.bat

      - name: Stage Windows artifact
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          KEY="${{ matrix.artifact_key }}"
          mkdir -p staged
          src="dist/hostswitch.exe"
          test -f "$src"
          cp "$src" "staged/hostswitch-${VERSION}-${KEY}.exe"
          ls -lh staged/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostswitch-${{ steps.ver.outputs.version }}-${{ matrix.artifact_key }}
          path: staged/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *) VERSION="$TAG" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: hostswitch-${{ steps.ver.outputs.version }}-*
          merge-multiple: true

      - name: List assets
        run: ls -lah release-assets/

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: hostswitch ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
